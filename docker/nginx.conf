# Single entry point of the self-hosted app. The browser only talks to this server: the API is proxied, so no absolute backend URL exists in the UI.

# State-changing / administrative calls are only accepted when the page was opened through a local host name. A browser cannot forge Host, so this blocks
# DNS-rebinding and accidental LAN use of write operations. It is NOT authentication: keep the published port bound to 127.0.0.1 (see SECURITY.md).
map $http_host $local_host {
    default 0;
    "~^(localhost|127\.0\.0\.1|\[::1\])(:[0-9]+)?$" 1;
}
map "$request_method:$local_host" $deny_write {
    default 0;
    "~^(POST|PUT|PATCH|DELETE):0$" 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers. Google Fonts is the only third-party origin the UI uses; the app still works with system fonts if it is blocked.
    # (nginx drops inherited add_header lines inside a location that sets its own, so the locations below repeat what they need.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        default_type application/json;          # only used for the 403 below: proxied responses keep the backend's Content-Type
        if ($deny_write) {
            return 403 '{"detail":"Administrative operations are only allowed from localhost"}';
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: any other path (client-side routes, reloads) serves index.html, which must never be cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
