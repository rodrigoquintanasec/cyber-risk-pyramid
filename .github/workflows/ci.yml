name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene (data and secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the secret scan covers every commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: No databases, backups, env files or obvious secrets in the published files
        run: python scripts/check_repo_hygiene.py
      - name: Gitleaks (working tree and history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-banner

  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-docker.txt
      - run: python -m pip install -r backend/requirements-docker.txt pytest
      - name: "pytest (temporary databases and mocked network only, no NVD import, no external requests)"
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: Frontend build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:briefing

  docker:
    name: Docker Compose (config, build, smoke test)
    runs-on: ubuntu-latest
    needs: [hygiene, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Compose file
        run: docker compose config --quiet
      - name: Build both images
        run: docker compose build
      - name: Start with a brand-new volume and wait for the healthchecks
        run: docker compose up -d --wait --wait-timeout 240
      - name: API and UI answer through the single published port
        run: |
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/some/spa/route
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/categories -H 'Host: attacker.example' -H 'Content-Type: application/json' -d '{"name":"x"}')" = "403"
      - name: The historical NVD import is never started automatically
        run: |
          sleep 20
          curl -fsS http://127.0.0.1:8080/api/v1/intel-db/status | python3 -c "import sys,json; d=json.load(sys.stdin)['datasets']; assert d['cve']['status']=='not_initialized' and d['cpe']['status']=='not_initialized', d"
      - name: No SQLite lock errors in the logs
        run: |
          docker compose logs backend > backend.log
          ! grep -i "database is locked" backend.log
      - name: Clean up (CI runner volume only)
        if: always()
        run: docker compose down -v
